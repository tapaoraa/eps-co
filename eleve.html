<style>
  body { font-family: system-ui, sans-serif; }
  .punch-grid { display: grid; gap: 4px; }
  .punch-cell {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #93c5fd;
    background: white;
  }
  .punch-cell.filled { background: #1e3a8a; border-color: #1e3a8a; }
  .card-option {
    cursor: pointer; border: 3px solid transparent;
    border-radius: 1rem; padding: 1rem;
    background: white; box-shadow: 0 1px 4px rgba(0,0,0,.15);
    transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
  }
  .card-option:hover { border-color: #93c5fd; }
  .card-option.selected { border-color: #2563eb; background: #eff6ff; }
  .card-option.correct  { border-color: #16a34a; background: #f0fdf4; }
  .card-option.wrong    { border-color: #dc2626; background: #fef2f2; }
  .step { display: none; }
  .step.active { display: block; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15%      { transform: translateX(-8px) rotate(-1deg); }
    30%      { transform: translateX(8px)  rotate(1deg); }
    45%      { transform: translateX(-6px) rotate(-1deg); }
    60%      { transform: translateX(6px)  rotate(1deg); }
    75%      { transform: translateX(-3px); }
    90%      { transform: translateX(3px); }
  }
  @keyframes btn-error {
    0%,100% { background:#1d4ed8; transform:scale(1); }
    20%     { background:#dc2626; transform:scale(.96); }
    50%     { background:#dc2626; transform:scale(1.03); }
    80%     { background:#dc2626; transform:scale(.97); }
  }
  .shake      { animation: shake .5s ease; }
  .btn-error  { animation: btn-error .5s ease; pointer-events:none; }
</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

<div class="max-w-lg mx-auto px-4 py-6">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <div class="w-10 h-10 bg-blue-700 rounded-xl flex items-center justify-center text-white text-lg font-bold">CO</div>
    <div>
      <h1 class="text-xl font-bold text-blue-900">Course d'orientation</h1>
      <p class="text-xs text-blue-600">Application élève</p>
    </div>
  </div>

  <!-- STEP 1 : Sélection numéro + parcours -->
  <div id="step1" class="step active">
    <div class="bg-white rounded-2xl shadow p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-2">Ton numéro élève</label>
        <div id="numGrid" style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;"></div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-2">Ton parcours</label>
        <div id="parcoursBtns" style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;"></div>
      </div>

      <button id="btnStart" disabled
        class="w-full bg-blue-700 text-white font-semibold py-3 rounded-xl disabled:opacity-40 transition">
        Commencer →
      </button>
    </div>
  </div>

  <!-- STEP 2 : Saisie poinçon -->
  <div id="step2" class="step">
    <div class="mb-4 flex items-center justify-between">
      <span id="posteLabel" class="text-sm font-medium text-blue-700 bg-blue-100 px-3 py-1 rounded-full"></span>
      <div id="progressDots" class="flex gap-1.5"></div>
    </div>

    <div class="bg-white rounded-2xl shadow p-5">
      <p class="text-center text-gray-500 text-sm mb-5">Reproduis le poinçon trouvé à ce poste</p>
      <div id="punchEditor" class="flex justify-center mb-6"></div>
      <button id="btnNext"
        class="w-full mt-2 bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
        Valider →
      </button>
    </div>
  </div>

  <!-- STEP 3 : QR code seul (avant scan) -->
  <div id="step3" class="step">
    <div class="bg-white rounded-2xl shadow p-6 text-center space-y-5">
      <h2 class="text-lg font-bold text-gray-800">Montre ce QR code au professeur</h2>
      <div id="qrcode" class="flex justify-center pt-2"></div>
      <p class="text-xs text-gray-400">Le professeur scanne le QR code, puis clique sur le bouton ci-dessous</p>
      <button id="btnShowCorrection"
        class="w-full bg-green-700 text-white font-semibold py-3 rounded-xl transition hover:bg-green-800">
        Voir la correction →
      </button>
    </div>
  </div>

  <!-- STEP 4 : Résultats / correction (sans QR, définitif) -->
  <div id="step4" class="step">
    <div class="bg-white rounded-2xl shadow p-6 text-center space-y-4">
      <div id="scoreCircle" class="w-28 h-28 rounded-full mx-auto flex flex-col items-center justify-center text-white font-bold shadow-lg">
        <span id="scoreNum" class="text-4xl"></span>
        <span class="text-sm opacity-80">/5</span>
      </div>
      <h2 id="scoreTxt" class="text-xl font-bold text-gray-800"></h2>

      <!-- Détail poste par poste avec le bon poinçon -->
      <div id="resultsDetail" class="text-left space-y-3 pt-1"></div>

      <button onclick="resetApp()" class="w-full mt-2 border-2 border-blue-700 text-blue-700 font-semibold py-3 rounded-xl">
        Nouvelle course
      </button>
    </div>
  </div>

</div>

<script>
let DATA = null;
let currentParcours = null;
let currentPosteIdx = 0;
let answers = []; // {poste, chosen, correct, isRight}
let postesList = []; // list of poste codes for current parcours
let selectedNum = null;

fetch('data.json')
  .then(r => r.json())
  .then(d => { DATA = d; initStep1(); })
  .catch(() => { document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui"><div style="text-align:center;padding:2rem"><p style="font-size:1.2rem;color:#dc2626;font-weight:600">Impossible de charger les données</p><p style="color:#6b7280;margin-top:.5rem">Vérifie ta connexion internet</p></div></div>'; });

function initStep1() {
  // Numéros 1-30 — grille de boutons
  const grid = document.getElementById('numGrid');
  const students = JSON.parse(localStorage.getItem('eps_students') || '{}');
  for (let i = 1; i <= 30; i++) {
    const btn = document.createElement('button');
    btn.dataset.n = i;
    btn.textContent = i;
    btn.style.cssText = 'padding:6px 2px;border-radius:8px;border:2px solid #e5e7eb;font-weight:600;font-size:0.875rem;color:#374151;text-align:center;transition:all .15s;';
    btn.onclick = () => {
      document.querySelectorAll('#numGrid button').forEach(b => {
        b.style.background = '';
        b.style.color = '#374151';
        b.style.borderColor = '#e5e7eb';
      });
      btn.style.background = '#1d4ed8';
      btn.style.color = 'white';
      btn.style.borderColor = '#1d4ed8';
      selectedNum = String(i);
      checkStep1Ready();
    };
    grid.appendChild(btn);
  }

  // Parcours buttons
  const container = document.getElementById('parcoursBtns');
  Object.keys(DATA.parcours).sort().forEach(p => {
    const btn = document.createElement('button');
    btn.textContent = p;
    btn.dataset.p = p;
    btn.style.cssText = 'padding:10px 2px;border-radius:8px;border:2px solid #e5e7eb;font-weight:700;font-size:1.1rem;color:#374151;text-align:center;transition:all .15s;';
    btn.onclick = () => {
      document.querySelectorAll('#parcoursBtns button').forEach(b => {
        b.style.background = '';
        b.style.color = '#374151';
        b.style.borderColor = '#e5e7eb';
      });
      btn.style.background = '#1d4ed8';
      btn.style.color = 'white';
      btn.style.borderColor = '#1d4ed8';
      currentParcours = p;
      checkStep1Ready();
    };
    container.appendChild(btn);
  });

  document.getElementById('btnStart').onclick = startQuiz;
}

function checkStep1Ready() {
  document.getElementById('btnStart').disabled = !(selectedNum && currentParcours);
}

function startQuiz() {
  postesList = DATA.parcours[currentParcours];
  currentPosteIdx = 0;
  answers = [];
  showStep('step2');
  showPoste(0);
}

// État de la saisie élève : {g:[...], m:[...], d:[...]}
let editorInput = null;

function showPoste(idx) {
  const posteCode = postesList[idx];
  const poste = DATA.postes[posteCode];

  document.getElementById('posteLabel').textContent = `Poste ${idx + 1} / 5`;

  // Progress dots
  const dots = document.getElementById('progressDots');
  dots.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'w-3 h-3 rounded-full ' + (i < idx ? 'bg-blue-600' : i === idx ? 'bg-blue-400' : 'bg-gray-200');
    dots.appendChild(d);
  }

  // Build empty interactive editor matching the poste format
  const fmt = poste.format; // '343' or '444'
  const hGD = fmt === '444' ? 4 : 3;
  editorInput = { g: Array(hGD).fill(0), m: Array(4).fill(0), d: Array(hGD).fill(0), fmt };

  renderEditor(document.getElementById('punchEditor'), editorInput);

  const btnNext = document.getElementById('btnNext');
  btnNext.textContent = idx < 4 ? 'Valider →' : 'Terminer ✓';
  btnNext.onclick = () => {
    const isEmpty =
      editorInput.g.every(v => v === 0) &&
      editorInput.m.every(v => v === 0) &&
      editorInput.d.every(v => v === 0);
    if (isEmpty) {
      const editor = document.getElementById('punchEditor');
      editor.classList.remove('shake');
      void editor.offsetWidth;
      editor.classList.add('shake');
      editor.addEventListener('animationend', () => editor.classList.remove('shake'), { once: true });
      return;
    }
    // Compare editorInput to poste
    const isRight =
      editorInput.g.join('') === poste.g.join('') &&
      editorInput.m.join('') === poste.m.join('') &&
      editorInput.d.join('') === poste.d.join('');

    answers.push({ posteIdx: idx + 1, posteCode, isRight, given: { g: [...editorInput.g], m: [...editorInput.m], d: [...editorInput.d], format: editorInput.fmt } });

    if (idx < 4) {
      currentPosteIdx++;
      showPoste(currentPosteIdx);
    } else {
      showResults();
    }
  };
}

// Render an interactive punch editor (or read-only display) into container el
// state = {g, m, d, fmt}, readOnly = false by default
function renderEditor(container, state, readOnly = false) {
  const { fmt } = state;
  const hGD = fmt === '444' ? 4 : 3;
  const S = 38; // cell size px
  const GAP = 6; // gap px
  const COL_GAP = 10; // gap between columns

  // For 343: G and D have 3 cells centred vertically within 4 rows
  // Centre offset: the 3 cells sit in the middle of the 4-row space
  // Total height of M col = 4*S + 3*GAP. We distribute the 3 GD cells centred:
  // offset_top = (totalH - (3*S + 2*GAP)) / 2
  const totalH = 4 * S + 3 * GAP;
  const gdH    = hGD * S + (hGD - 1) * GAP;
  const gdTop  = (totalH - gdH) / 2; // vertical offset for GD cols in 343

  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = `display:flex;gap:${COL_GAP}px;align-items:flex-start;padding:12px;background:#f8fafc;border-radius:12px;`;

  ['g', 'm', 'd'].forEach(col => {
    const h = col === 'm' ? 4 : hGD;
    const colEl = document.createElement('div');
    colEl.style.cssText = `display:flex;flex-direction:column;gap:${GAP}px;` +
      (fmt === '343' && col !== 'm' ? `margin-top:${gdTop}px;` : '');

    for (let i = 0; i < h; i++) {
      const dot = document.createElement('div');
      const on = state[col][i] === 1;
      dot.style.cssText = `width:${S}px;height:${S}px;border-radius:50%;border:2.5px solid;cursor:${readOnly ? 'default' : 'pointer'};transition:all .12s;` +
        (on ? 'background:#1e3a8a;border-color:#1e3a8a;box-shadow:0 2px 6px #1e3a8a44;'
            : 'background:white;border-color:#93c5fd;');
      if (!readOnly) {
        dot.addEventListener('click', () => {
          state[col][i] = state[col][i] ? 0 : 1;
          const nowOn = state[col][i] === 1;
          dot.style.background = nowOn ? '#1e3a8a' : 'white';
          dot.style.borderColor = nowOn ? '#1e3a8a' : '#93c5fd';
          dot.style.boxShadow   = nowOn ? '0 2px 6px #1e3a8a44' : 'none';
        });
      }
      colEl.appendChild(dot);
    }
    wrap.appendChild(colEl);
  });

  container.appendChild(wrap);
}

// Read-only punch render (for prof mini display etc.)
function renderPunch(poste, size = 22) {
  const fmt = poste.format;
  const hGD = fmt === '444' ? 4 : 3;
  const GAP = 3, COL_GAP = 5;
  const totalH = 4 * size + 3 * GAP;
  const gdH    = hGD * size + (hGD - 1) * GAP;
  const gdTop  = (totalH - gdH) / 2;

  let html = `<div style="display:flex;gap:${COL_GAP}px;align-items:flex-start;">`;
  ['g','m','d'].forEach(col => {
    const arr = poste[col];
    const h = col === 'm' ? 4 : hGD;
    const mt = (fmt === '343' && col !== 'm') ? gdTop : 0;
    html += `<div style="display:flex;flex-direction:column;gap:${GAP}px;margin-top:${mt}px;">`;
    for (let i = 0; i < h; i++) {
      const v = arr[i];
      const s = v === 1
        ? `background:#1e3a8a;border-color:#1e3a8a`
        : `background:white;border-color:#93c5fd`;
      html += `<div style="width:${size}px;height:${size}px;border-radius:50%;border:2px solid;${s}"></div>`;
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function showResults() {
  const score = answers.filter(a => a.isRight).length;

  // Generate QR code data
  const students = JSON.parse(localStorage.getItem('eps_students') || '{}');
  const name = students[selectedNum] || '';
  const qrData = JSON.stringify({
    n: parseInt(selectedNum),
    nom: name,
    p: currentParcours,
    s: score,
    r: answers.map(a => a.isRight ? 1 : 0).join(''),
    t: Date.now()
  });

  document.getElementById('qrcode').innerHTML = '';
  const canvas = document.createElement('canvas');
  document.getElementById('qrcode').appendChild(canvas);
  new QRious({ element: canvas, value: qrData, size: 200, foreground: '#1e3a8a' });

  // Wire up the "Voir la correction" button — one-time use
  const btnShowCorrection = document.getElementById('btnShowCorrection');
  btnShowCorrection.onclick = () => {
    // Destroy QR permanently before showing correction
    document.getElementById('qrcode').innerHTML = '';
    showCorrection(score);
    showStep('step4');
  };

  showStep('step3');
}

function showCorrection(score) {
  const circle = document.getElementById('scoreCircle');
  const colors = ['bg-red-500','bg-orange-400','bg-yellow-400','bg-blue-500','bg-green-500','bg-green-600'];
  circle.className = 'w-28 h-28 rounded-full mx-auto flex flex-col items-center justify-center text-white font-bold shadow-lg ' + colors[score];

  document.getElementById('scoreNum').textContent = score;
  const msgs = ['Courage, réessaie !','Continue tes efforts','Pas mal !','Bien !','Très bien !','Excellent !'];
  document.getElementById('scoreTxt').textContent = msgs[score];

  const detailEl = document.getElementById('resultsDetail');
  detailEl.innerHTML = '';
  answers.forEach((a, i) => {
    const poste = DATA.postes[a.posteCode];
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;background:' +
      (a.isRight ? '#f0fdf4' : '#fef2f2');
    row.innerHTML = `
      <span style="font-size:1.2rem">${a.isRight ? '✅' : '❌'}</span>
      <span style="font-weight:600;color:#374151;font-size:.9rem;min-width:60px">Poste ${i+1}</span>
      <span style="font-size:.75rem;color:#6b7280;background:#e5e7eb;padding:2px 6px;border-radius:6px;font-family:monospace">${a.posteCode}</span>
      ${a.isRight ? '<span style="color:#16a34a;font-size:.85rem;margin-left:auto">Correct !</span>' : ''}
    `;
    if (!a.isRight) {
      const punchsWrap = document.createElement('div');
      punchsWrap.style.cssText = 'display:flex;gap:28px;margin-left:auto;align-items:flex-end;';
      const givenWrap = document.createElement('div');
      givenWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;';
      givenWrap.innerHTML = `<span style="font-size:.7rem;color:#6b7280;">Saisi</span>`;
      const givenPunch = document.createElement('div');
      givenPunch.innerHTML = renderPunch(a.given, 18);
      givenWrap.appendChild(givenPunch);
      const correctWrap = document.createElement('div');
      correctWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;';
      correctWrap.innerHTML = `<span style="font-size:.7rem;color:#16a34a;font-weight:600;">Correct</span>`;
      const correctPunch = document.createElement('div');
      correctPunch.innerHTML = renderPunch(poste, 18);
      correctWrap.appendChild(correctPunch);
      punchsWrap.appendChild(givenWrap);
      punchsWrap.appendChild(correctWrap);
      row.appendChild(punchsWrap);
    }
    detailEl.appendChild(row);
  });
}

function showStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetApp() {
  currentParcours = null;
  currentPosteIdx = 0;
  answers = [];
  postesList = [];
  selectedNum = null;
  document.querySelectorAll('#numGrid button').forEach(b => {
    b.style.background = '';
    b.style.color = '#374151';
    b.style.borderColor = '#e5e7eb';
  });
  document.querySelectorAll('#parcoursBtns button').forEach(b => {
    b.style.background = '';
    b.style.color = '#374151';
    b.style.borderColor = '#e5e7eb';
  });
  document.getElementById('btnStart').disabled = true;
  showStep('step1');
}
